<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diwanul</title>
  <meta name="description" content="Diwanul">
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
      --accent: #2563eb; --card: #f6f7f9; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9ca3af;
        --accent: #6ea8fe; --card: #161b22; --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      line-height: 1.6;
    }
    .wrap { width: 100%; max-width: 640px; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    .links { display: grid; gap: 12px; }
    a.card {
      display: flex; align-items: center; gap: 12px; text-decoration: none;
      color: var(--fg); background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; transition: transform .12s ease, border-color .12s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
    a.card .t { font-weight: 600; }
    a.card .d { color: var(--muted); font-size: .9rem; }
    a.card .col { display: flex; flex-direction: column; }
    .ic { font-size: 1.4rem; width: 28px; text-align: center; }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: .8rem; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Diwanul</h1>
    <nav class="links">
      <a class="card" href="https://blog.diwanul.xyz">
        <span class="ic">✍️</span>
        <span class="col"><span class="t">Blog</span>
        <span class="d">Notes & writing</span></span>
      </a>
      <a class="card" href="https://github.com/Diwanul">
        <span class="ic">💻</span>
        <span class="col"><span class="t">GitHub</span>
        <span class="d">Code & projects</span></span>
      </a>
      <a class="card" href="mailto:DiwanulHowl@gmail.com">
        <span class="ic">✉️</span>
        <span class="col"><span class="t">Email</span>
        <span class="d">DiwanulHowl@gmail.com</span></span>
      </a>
    </nav>
    <footer>© <span id="y"></span> Diwanul</footer>
  </div>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
